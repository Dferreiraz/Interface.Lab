<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP | Interface.Lab</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>Consulta de CEP</h1>
            <p>Descubra o endereço completo a partir do código postal.</p>
        </header>

        <form id="cep-form" class="search-form">
            <div class="input-group">
                <input 
                    type="text" 
                    id="cep-input" 
                    placeholder="Digite o CEP (ex: 01001-000)" 
                    maxlength="9"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="search-btn">Buscar</button>
            </div>
            <p class="error-msg" id="error-msg"></p>
        </form>

        <section id="result-section" class="result-section hidden">
            <div class="result-grid">
                <div class="result-item">
                    <span class="label">Logradouro</span>
                    <span class="value" id="res-logradouro">--</span>
                </div>
                <div class="result-item">
                    <span class="label">Bairro</span>
                    <span class="value" id="res-bairro">--</span>
                </div>
                <div class="result-item">
                    <span class="label">Cidade / UF</span>
                    <span class="value" id="res-cidade">--</span>
                </div>
                <div class="result-item">
                    <span class="label">Estado</span>
                    <span class="value" id="res-estado">--</span>
                </div>
            </div>
        </section>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
